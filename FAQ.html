<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업무 FAQ 검색</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --highlight: #fff1a8;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    .title {
      margin: 0 0 24px;
      font-size: 36px;
      letter-spacing: -0.03em;
    }

    .search-panel {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    #searchInput {
      flex: 1;
      height: 52px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    #searchInput:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    #viewAllBtn {
      height: 52px;
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: var(--primary);
      font-weight: 700;
      cursor: pointer;
    }

    .filter-label {
      display: block;
      margin: 18px 0 10px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .filter-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #475569;
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-btn.active {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 30px 0 14px;
    }

    .result-header h2 {
      margin: 0;
      font-size: 21px;
    }

    #resultCount {
      color: var(--muted);
      font-size: 14px;
    }

    #resultCount strong {
      color: var(--primary);
    }

    .results {
      display: grid;
      gap: 14px;
    }

    .faq-card {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .category {
      display: inline-block;
      margin-bottom: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--primary);
      background: var(--primary-soft);
      font-size: 12px;
      font-weight: 800;
    }

    .field {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 10px;
      align-items: start;
    }

    .field + .field {
      margin-top: 12px;
    }

    .field-label {
      padding-top: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .question,
    .answer {
      margin: 0;
      line-height: 1.7;
    }

    .question {
      font-size: 18px;
      font-weight: 700;
    }

    .answer {
      color: #475569;
    }

    mark {
      padding: 0 2px;
      border-radius: 3px;
      color: inherit;
      background: var(--highlight);
      font-weight: 800;
    }

    .empty {
      padding: 44px 20px;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.8);
      text-align: center;
    }

    @media (max-width: 640px) {
      .app {
        width: min(100% - 24px, 960px);
        padding-top: 32px;
      }

      .title {
        font-size: 30px;
      }

      .search-row {
        flex-direction: column;
      }

      #viewAllBtn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1 class="title">업무 FAQ 검색</h1>

    <section class="search-panel" aria-label="FAQ 검색 및 분류">
      <div class="search-row">
        <input
          id="searchInput"
          type="search"
          placeholder="질문이나 키워드를 입력하세요."
          aria-label="질문이나 키워드 검색"
          autocomplete="off"
        />
        <button id="viewAllBtn" type="button">전체보기</button>
      </div>

      <span class="filter-label">분류</span>
      <div id="filterList" class="filter-list"></div>
    </section>

    <section aria-live="polite">
      <div class="result-header">
        <h2>검색 결과</h2>
        <div id="resultCount"></div>
      </div>

      <div id="results" class="results"></div>
    </section>
  </main>

  <script>
    // 첨부 JSON에 있는 내용만 사용합니다.
    const faqData = [
      {
        category: "교육",
        question: "교육 신청은 어디에서 하나요?",
        answer_seed: "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."
      },
      {
        category: "교육",
        question: "신청한 교육을 취소하려면 어떻게 하나요?",
        answer_seed: "신청내역에서 취소 가능 여부를 확인합니다."
      },
      {
        category: "문서",
        question: "주간 업무보고에는 무엇을 넣어야 하나요?",
        answer_seed: "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."
      },
      {
        category: "IT",
        question: "사내 시스템 접속이 되지 않습니다.",
        answer_seed: "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."
      },
      {
        category: "보안",
        question: "ChatGPT에 내부 업무자료를 넣어도 되나요?",
        answer_seed: "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."
      },
      {
        category: "일정",
        question: "오늘 일정은 어떻게 되나요?",
        answer_seed: "업무별, 시간대 일정을 먼저 확인합니다."
      }
    ];

    const categories = ["전체", "교육", "문서", "IT", "보안", "일정"];

    const searchInput = document.getElementById("searchInput");
    const viewAllBtn = document.getElementById("viewAllBtn");
    const filterList = document.getElementById("filterList");
    const resultCount = document.getElementById("resultCount");
    const results = document.getElementById("results");

    let selectedCategory = "전체";

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeRegExp(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightText(text, keyword) {
      const safeText = escapeHtml(text);
      const query = keyword.trim();

      if (!query) {
        return safeText;
      }

      const regex = new RegExp(`(${escapeRegExp(query)})`, "gi");
      return safeText.replace(regex, "<mark>$1</mark>");
    }

    function renderFilters() {
      filterList.innerHTML = categories
        .map(category => `
          <button
            type="button"
            class="filter-btn ${selectedCategory === category ? "active" : ""}"
            data-category="${category}"
            aria-pressed="${selectedCategory === category}"
          >
            ${category}
          </button>
        `)
        .join("");
    }

    function getFilteredFaqs() {
      const keyword = searchInput.value.trim().toLowerCase();

      return faqData.filter(item => {
        const categoryMatched =
          selectedCategory === "전체" ||
          item.category === selectedCategory;

        const keywordMatched =
          !keyword ||
          item.question.toLowerCase().includes(keyword) ||
          item.answer_seed.toLowerCase().includes(keyword) ||
          item.category.toLowerCase().includes(keyword);

        return categoryMatched && keywordMatched;
      });
    }

    function renderResults() {
      const keyword = searchInput.value.trim();
      const filteredFaqs = getFilteredFaqs();

      resultCount.innerHTML =
        `총 <strong>${filteredFaqs.length}</strong>건`;

      if (filteredFaqs.length === 0) {
        results.innerHTML = `
          <div class="empty">
            검색 결과가 없습니다.
          </div>
        `;
        return;
      }

      results.innerHTML = filteredFaqs
        .map(item => `
          <article class="faq-card">
            <div class="category">
              ${highlightText(item.category, keyword)}
            </div>

            <div class="field">
              <span class="field-label">질문</span>
              <p class="question">
                ${highlightText(item.question, keyword)}
              </p>
            </div>

            <div class="field">
              <span class="field-label">답변</span>
              <p class="answer">
                ${highlightText(item.answer_seed, keyword)}
              </p>
            </div>
          </article>
        `)
        .join("");
    }

    function updateView() {
      renderFilters();
      renderResults();
    }

    searchInput.addEventListener("input", renderResults);

    filterList.addEventListener("click", event => {
      const button = event.target.closest("[data-category]");

      if (!button) {
        return;
      }

      selectedCategory = button.dataset.category;
      updateView();
    });

    viewAllBtn.addEventListener("click", () => {
      searchInput.value = "";
      selectedCategory = "전체";
      updateView();
      searchInput.focus();
    });

    updateView();
  </script>
</body>
</html>
